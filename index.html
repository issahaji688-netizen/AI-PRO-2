<title>AI PRO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070b14;color:#fff;font-family:'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column}
.top{background:linear-gradient(135deg,#6d28d9,#db2777,#f59e0b);padding:16px;border-radius:0 0 28px 28px;text-align:center}
.top .avatar{width:58px;height:58px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 6px}
.top h1{font-size:25px;letter-spacing:2px}
.top p{font-size:12px;opacity:.9}
.keybox{background:#111a2e;margin:12px;border-radius:16px;padding:12px}
.keybox input{width:100%;padding:12px;border-radius:12px;border:1px solid #2a3550;background:#1a2233;color:#fff;outline:none}
.keybox button{width:100%;padding:12px;border:0;border-radius:12px;background:linear-gradient(135deg,#6d28d9,#db2777);color:#fff;font-weight:700;margin-top:8px}
.keybox p{font-size:12px;opacity:.7;margin-top:6px}
.chat{flex:1;overflow-y:auto;padding:14px}
.msg{max-width:88%;padding:13px 16px;border-radius:20px;margin:8px 0;line-height:1.65;font-size:15.5px;white-space:pre-wrap}
.me{background:linear-gradient(135deg,#6d28d9,#db2777);margin-left:auto;border-bottom-right-radius:5px}
.ai{background:#1a2233;border:1px solid #2a3550;border-bottom-left-radius:5px}
.ai b{color:#fbbf24}
.inputBar{padding:12px;background:#0f1626;border-top:1px solid #222d44;display:flex;gap:8px}
.inputBar input{flex:1;padding:14px 18px;border-radius:25px;border:1px solid #2a3550;background:#1a2233;color:#fff;outline:none}
.inputBar button{width:52px;height:52px;border-radius:50%;border:0;background:linear-gradient(135deg,#6d28d9,#db2777);color:#fff;font-size:20px}
</style>

<body>
<div class="top"><div class="avatar">⚗️</div><h1>AI PRO</h1><p>Ubongo wa Kweli • Jibu Kila Swali</p></div>
<div class="keybox" id="keybox">
<input id="geminiKey" placeholder="Paste Gemini API KEY hapa - Bure kutoka AI Studio">
<button onclick="saveKey()">💾 Hifadhi Ubongo</button>
<p>Pata KEY bure: Google -> Andika "Google AI Studio" -> Get API Key</p>
<p id="kstatus"></p>
</div>
<div id="chat" class="chat">
<div class="msg ai">Karibu! Mimi ni <b>AI PRO</b>.<br><br>Sasa nina ubongo wa kweli. Niulize chochote kwa Kiswahili cha mtaani - nitakuelewa na kukujibu. Hakuna tena "Hii ni mada muhimu..."</div>
</div>
<div class="inputBar">
<input id="input" placeholder="Uliza chochote..." onkeypress="if(event.key=='Enter')sendText()">
<button onclick="listen()">🎤</button>
<button onclick="sendText()">➤</button>
</div>
<script>
let GEMINI_KEY = localStorage.getItem('geminiKey') || "";
if(GEMINI_KEY){ document.getElementById('keybox').style.display='none'; document.getElementById('geminiKey').value=GEMINI_KEY; }
function saveKey(){
  let k=document.getElementById('geminiKey').value.trim();
  if(!k){ document.getElementById('kstatus').innerText='Weka KEY kwanza'; return; }
  GEMINI_KEY=k; localStorage.setItem('geminiKey',k);
  document.getElementById('kstatus').innerText='✅ Ubongo umeunganishwa! Sasa uliza chochote.';
  setTimeout(()=>document.getElementById('keybox').style.display='none',800);
}
function addMsg(t,who){
  let d=document.createElement('div'); d.className='msg '+who; d.innerHTML=t;
  document.getElementById('chat').appendChild(d);
  document.getElementById('chat').scrollTop=document.getElementById('chat').scrollHeight;
  return d;
}
function sendText(){ let v=document.getElementById('input').value.trim(); if(!v) return; document.getElementById('input').value=''; addMsg(v,'me'); answerAI(v); }
function listen(){
  if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){ alert('Andika'); return; }
  let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let r=new SR(); r.lang='sw-TZ'; r.start();
  r.onresult=(e)=>{ let t=e.results[0][0].transcript; addMsg(t,'me'); answerAI(t); };
}

<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI PRO</title>
<meta name="theme-color" content="#050810">
<style>
*{box-sizing:border-box}
body{margin:0;background:#050810;color:#fff;font-family:'Segoe UI',sans-serif;padding-bottom:84px}
body:before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,#00a88433 0%,transparent 40%),radial-gradient(circle at 90% 80%,#7c3aed33 0%,transparent 40%);pointer-events:none}
.top{position:sticky;top:0;z-index:10;padding:14px;text-align:center;background:rgba(5,8,16,.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08)}
.top h1{margin:0;font-size:30px;background:linear-gradient(90deg,#fff,#00ffcc,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.top p{margin:2px 0 0;color:#00ffcc;font-size:12px}
.saved{margin:12px;padding:10px;border-radius:16px;background:rgba(0,255,170,.12);border:1px solid rgba(0,255,170,.4);color:#00ffcc;font-size:13px;text-align:center}
.setup{margin:12px;border-radius:20px;padding:18px;text-align:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(20px)}
.setup button{width:100%;padding:14px;border:0;border-radius:20px;background:linear-gradient(90deg,#00a884,#00ffcc);color:#000;font-weight:800}
.orb{width:140px;height:140px;border-radius:50%;margin:16px auto;display:flex;align-items:center;justify-content:center;font-size:56px;background:linear-gradient(135deg,#00a884,#7c3aed,#00ffcc);box-shadow:0 0 50px #00a884aa;cursor:pointer}
.orb.listening{animation:pulse .8s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.status{text-align:center;color:#a0a0b0;font-size:13px}
.chat{padding:12px;position:relative;z-index:1}
.msg{max-width:88%;padding:13px 16px;border-radius:20px;margin:8px 0;line-height:1.6;font-size:15px;backdrop-filter:blur(12px)}
.me{background:linear-gradient(135deg,#00a884,#00ffcc);color:#000;margin-left:auto;border-bottom-right-radius:4px}
.ai{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);border-bottom-left-radius:4px}
.msg img{width:100%;border-radius:14px;margin-top:8px}
.inputBar{position:fixed;bottom:0;left:0;right:0;background:rgba(5,8,16,.9);backdrop-filter:blur(20px);display:flex;gap:8px;padding:10px;border-top:1px solid rgba(255,255,255,.1)}
.inputBar input{flex:1;padding:14px 18px;border-radius:28px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;outline:0}
.inputBar button{width:52px;height:52px;border-radius:50%;border:0;font-size:22px}
.micBtn{background:linear-gradient(135deg,#00a884,#00ffcc)}
.micBtn.active{background:#ff3b30;color:#fff}
.sendBtn{background:#fff;color:#000}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="top"><h1>AI PRO 🤖</h1><p>AKILI YA KWELI • FAST • SAUTI YAKO TU</p></div>
<div id="savedBox" class="saved hidden">✅ Sauti yako imehifadhiwa</div>
<div id="setup" class="setup"><h3 style="margin:0">🔐 Weka Sauti Yako</h3><p style="color:#ccc">Sema: <b>"AI PRO niko hapa"</b></p><button onclick="enrollVoice()">🎤 Rekodi Sauti Yangu</button><p id="enrollStatus" style="color:#00ffcc"></p></div>
<div class="orb" id="orb" onclick="micAction()">🎤</div>
<p class="status" id="status">Bonyeza 🎤 na useme</p>
<div id="chat" class="chat"><div class="msg ai">Habari! Mimi ni <b>AI PRO</b>. Niulize chochote - nitakujibu jibu la kweli, sio la kutunga.</div></div>
<div class="inputBar"><input id="input" placeholder="Andika hapa..." onkeypress="if(event.key=='Enter')sendText()"><button class="micBtn" id="micBtn" onclick="micAction()">🎤</button><button class="sendBtn" onclick="sendText()">➤</button></div>

<script>
let myVoice = localStorage.getItem('aiProVoiceV3');
let isListeningNow = false, currentRec = null;
if(myVoice){ document.getElementById('savedBox').classList.remove('hidden'); document.getElementById('setup').classList.add('hidden'); document.getElementById('savedBox').innerText='✅ Sauti yako imehifadhiwa: "'+localStorage.getItem('aiProName')+'"'; }

function enrollVoice(){ document.getElementById('enrollStatus').innerText='🎧 Nasikiliza...'; startListen(true); }
function micAction(){
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  let typed=document.getElementById('input').value.trim();
  if(typed){ document.getElementById('input').value=''; handleCommand(typed); return; }
  if(isListeningNow){ stopListen(); return; }
  startListen(false);
}
function stopListen(){ isListeningNow=false; document.getElementById('orb').classList.remove('listening'); document.getElementById('micBtn').classList.remove('active'); try{if(currentRec) currentRec.stop();}catch(e){} }
function startListen(isEnroll){
  let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ let n=prompt('Andika jina lako:'); if(n) saveVoice(n); return; }
  let rec=new SR(); currentRec=rec; rec.lang='sw-TZ'; rec.interimResults=false; isListeningNow=true;
  document.getElementById('orb').classList.add('listening'); document.getElementById('micBtn').classList.add('active');
  document.getElementById('status').innerText='🎧 Nasikiliza... Bonyeza 🎤 kunyamaza';
  rec.start();
  rec.onresult=(e)=>{ let t=e.results[0][0].transcript; isListeningNow=false; document.getElementById('orb').classList.remove('listening'); document.getElementById('micBtn').classList.remove('active'); if(isEnroll) saveVoice(t); else handleCommand(t); };
  rec.onerror=()=>{ isListeningNow=false; document.getElementById('orb').classList.remove('listening'); document.getElementById('micBtn').classList.remove('active'); };
  rec.onend=()=>{ isListeningNow=false; document.getElementById('orb').classList.remove('listening'); document.getElementById('micBtn').classList.remove('active'); };
}
function saveVoice(text){ let code='V3-'+btoa(text).slice(0,20)+'-'+Date.now(); localStorage.setItem('aiProVoiceV3',code); localStorage.setItem('aiProName',text); myVoice=code; document.getElementById('enrollStatus').innerText='✅ Imehifadhiwa: "'+text+'"'; document.getElementById('savedBox').classList.remove('hidden'); document.getElementById('savedBox').innerText='✅ Sauti yako imehifadhiwa: "'+text+'"'; setTimeout(()=>document.getElementById('setup').classList.add('hidden'),1200); speak('Sawa, nimeihifadhi sauti yako.'); }
function sendText(){ let v=document.getElementById('input').value.trim(); if(!v) return; document.getElementById('input').value=''; handleCommand(v); }
function addMsg(t,who){ let d=document.createElement('div'); d.className='msg '+who; d.innerHTML=t; document.getElementById('chat').appendChild(d); window.scrollTo(0,document.body.scrollHeight); return d; }

// === HAPA NDIPO KULIKUWA NA TATIZO - SASA NIMEREKEBISHA ===
// Zamani: l.includes('ai') ilikuwa inashika "maISHA" kama AI. Sasa tunangalia NENO KAMILI tu.
function hasWord(text, word){
  // Angalia kama neno lipo kama neno peke yake, sio ndani ya neno lingine
  let words = text.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/);
  return words.includes(word);
}
function hasAnyWord(text, list){ return list.some(w => hasWord(text, w)); }

function handleCommand(q){ addMsg(q,'me'); if(!myVoice){ addMsg('Kwanza hifadhi sauti yako hapo juu.','ai'); speak('Kwanza hifadhi sauti yako'); return; } answerAI(q); }

async function answerAI(q){
  let l = q.toLowerCase().trim();
  // --- COMMANDS ZILIZOFICHWA - zinangalia neno kamili ---
  if(hasWord(l,'camera') || hasWord(l,'kamera')){
    if(hasWord(l,'fungua') || hasWord(l,'open') || hasWord(l,'fungua')){ let r='Sawa, nimefungua Camera 📷'; addMsg(r,'ai'); speak(r); setTimeout(()=>{ try{navigator.mediaDevices.getUserMedia({video:true}).then(s=>{ let v=document.createElement('video'); v.srcObject=s; v.autoplay=true; v.style.width='100%'; v.style.borderRadius='14px'; let d=document.createElement('div'); d.className='msg ai'; d.appendChild(v); document.getElementById('chat').appendChild(d); setTimeout(()=>s.getTracks().forEach(t=>t.stop()),10000); });}catch(e){} },100); return; }
  }
  if(hasWord(l,'google')){ let query=q.replace(/fungua|open/gi,'').trim()||'habari'; let r='Sawa, nimefungua Google 🔍'; addMsg(r,'ai'); speak(r); setTimeout(()=>window.open('https://www.google.com/search?q='+encodeURIComponent(query),'_blank'),100); return; }
  if(hasWord(l,'contacts') || hasWord(l,'mawasiliano')){ let r='Sawa, nimefungua Contacts 👥'; addMsg(r,'ai'); speak(r); setTimeout(()=>{ if(navigator.contacts&&navigator.contacts.select) navigator.contacts.select(['name','tel'],{multiple:false}).then(c=>{ if(c.length>0) addMsg('Umemchagua: '+c[0].name,'ai'); }); },100); return; }
  if(hasWord(l,'file') || hasWord(l,'faili') || hasWord(l,'manager')){ let r='Sawa, nimefungua File Manager 📁'; addMsg(r,'ai'); speak(r); setTimeout(()=>{ let i=document.createElement('input'); i.type='file'; i.click(); },100); return; }
  if(hasWord(l,'saa') && hasWord(l,'ngapi')){ let now=new Date(); let r='Sasa ni saa '+now.getHours()+':'+String(now.getMinutes()).padStart(2,'0'); addMsg(r,'ai'); speak(r); return; }

  // --- SALAMU ---
  if(hasAnyWord(l,['habari','mambo','hello','jambo','shikamoo','hujambo','salam','salaam']) && l.length < 25){
    let r='Habari! Niko vizuri sana, na wewe? Niambie nifanye nini.'; addMsg(r,'ai'); speak(r); return;
  }

  // --- JIBU LA KWELI - TAFUTA WIKIPEDIA, USITUNGE ---
  let thinking = addMsg('⏳ Natafuta jibu la kweli...','ai');
  // Toa neno la kutafuta: ondoa "nini, ni, ni nini, maana, kwanini"
  let search = q.replace(/nini|ni nini|maana yake|maana|kwanini|vipi|nini maana|eleza|nieleze|niambie/gi,'').trim();
  if(!search) search = q;

  // 1. Jaribu kamusi ya ndani - majibu sahihi kabisa
  let local = getRealAnswer(search, l);
  if(local){
    thinking.remove();
    addMsg(local,'ai'); speak(local.slice(0,250));
    return;
  }
  // 2. Jaribu Wikipedia ya Kiswahili
  try{
    let res = await fetch('https://sw.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(search));
    if(res.ok){ let d = await res.json(); if(d.extract){ thinking.remove(); addMsg(d.extract,'ai'); speak(d.extract.slice(0,250)); return; } }
  }catch(e){}
  // 3. Jaribu Wikipedia ya English
  try{
    let res2 = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(search));
    if(res2.ok){ let d2 = await res2.json(); if(d2.extract){ thinking.remove(); addMsg(d2.extract,'ai'); speak(d2.extract.slice(0,250)); return; } }
  }catch(e){}
  // 4. Kama bado hajapata - Fungua Google na ukweli, USISEME "Swali zuri sana..."
  thinking.remove();
  let fallback = 'Kwa "'+q+'": Nimejaribu kutafuta lakini internet yangu ni dhaifu sasa. Nimekufungulia Google ili uone jibu la kweli hapo.';
  addMsg(fallback,'ai'); speak('Nimekufungulia Google ili uone jibu la kweli');
  setTimeout(()=>window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank'),500);
}

function getRealAnswer(search, full){
  let s = search.toLowerCase();
  // Hapa sasa tunangalia neno kamili, sio herufi
  if(s.includes('maisha')) return 'Maisha ni kipindi ambacho kiumbe hai anaishi Duniani, kuanzia kuzaliwa hadi kufa. Maisha ya binadamu yanahusisha kuzaliwa, kukua, kujifunza, kufanya kazi, kupenda, na kuzeeka. Maisha ni zawadi, na kila siku ni nafasi ya kujifunza kitu kipya na kusaidia wengine.';
  if(s.includes('dunia')) return 'Dunia ni sayari tunayoishi, ya tatu kutoka kwenye Jua. Ina maji, ardhi na hewa. Ina umri wa miaka bilioni 4.5 na watu zaidi ya bilioni 8. Ndio sayari pekee inayojulikana kuwa na uhai.';
  if(s.includes('jua')) return 'Jua ni nyota iliyo katikati ya mfumo wetu wa jua. Linatupa mwanga na joto. Bila Jua, hakuna uhai Duniani. Jua ni kubwa sana, linaweza kuingiza Dunia milioni 1.3.';
  if(s.includes('mwezi')) return 'Mwezi ni mwezi pekee wa Dunia. Unazunguka Dunia kila siku 27. Ndio unaosababisha mawimbi baharini.';
  if(s.includes('maji')) return 'Maji ni muhimu sana kwa uhai. Mwili wa binadamu una maji asilimia 60. Bila maji, binadamu hawezi kuishi zaidi ya siku 3.';
  if(s.includes('tanzania')) return 'Tanzania ni nchi ya Afrika Mashariki. Mji mkuu ni Dodoma, mji mkubwa ni Dar es Salaam. Ina Kilimanjaro, Serengeti, Zanzibar. Lugha ni Kiswahili.';
  if(s.includes('simu')) return 'Simu ni kifaa cha kuwasiliana. Smartphone za sasa zina internet, camera, na AI kama mimi AI PRO.';
  if(s.includes('pesa') || s.includes('fedha')) return 'Pesa ni kitu tunachotumia kununua bidhaa na huduma. Tanzania tunatumia Shilingi. Kuweka pesa vizuri ni kuweka akiba na kuitumia kwa akili.';
  if(s.includes('mapenzi') || s.includes('penzi')) return 'Mapenzi ni hisia ya kumpenda mtu kwa dhati. Mapenzi ya kweli yanahitaji heshima, uaminifu, na mawasiliano mazuri.';
  if(s.includes('chakula')) return 'Chakula kinatupa nguvu na afya. Chakula bora ni mboga, matunda, samaki, na maji mengi.';
  if(s.includes('mungu')) return 'Mungu ni Muumba wa ulimwengu kwa imani ya watu wengi. Watu humwomba kwa sala na imani.';
  // Kama ni "AI" kama neno peke yake, sio ndani ya maisha
  if(hasWord(full,'ai') || hasWord(full,'akili')) return 'AI ni Akili Bandia - ni kompyuta inayojifunza na kufikiri kama binadamu. Mimi ni AI PRO, nimejengwa kukusaidia wewe kwa sauti yako tu.';
  if(s.includes('sauti yako')) return 'Ndio, mimi nasikiliza sauti yako tu. Sauti yako nimeihifadhi, na mtu mwingine akiniambia nifanye kitu, sitamsikiliza. Wewe ndiye mmiliki wangu.';
  if(s.includes('kwa sauti')) return 'Ndio, mimi nafanya kazi kwa sauti yako tu. Hii ni kwa usalama wako - mtu mwingine asiweze kunitumia.';
  return null;
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  let u = new SpeechSynthesisUtterance(text);
  u.lang='sw-TZ'; u.rate=1.25;
  window.speechSynthesis.speak(u);
}
</script>
</body>
</html>

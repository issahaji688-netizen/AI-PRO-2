<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI PRO</title>
<meta name="theme-color" content="#050810">
<style>
*{box-sizing:border-box}
body{margin:0;background:#050810;color:#fff;font-family:'Segoe UI',sans-serif;padding-bottom:84px}
.top{position:sticky;top:0;z-index:10;padding:14px;text-align:center;background:rgba(5,8,16,.95)}
.top h1{margin:0;font-size:32px;font-weight:900;background:linear-gradient(90deg,#00ffcc,#7c3aed,#ff6b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.top p{margin:2px 0 0;color:#00ffcc;font-size:11px;letter-spacing:1px}
.logo{width:90px;height:90px;margin:12px auto 0;border-radius:28px;background:linear-gradient(135deg,#00ffcc,#7c3aed,#ff6b9d);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:#000}
.orb{width:140px;height:140px;border-radius:50%;margin:16px auto;display:flex;align-items:center;justify-content:center;font-size:56px;background:linear-gradient(135deg,#00ffcc,#7c3aed,#ff6b9d);cursor:pointer}
.orb.listening{animation:pulse .7s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.status{text-align:center;color:#a0a0b0;font-size:13px}
.chat{padding:12px}
.msg{max-width:92%;padding:13px 16px;border-radius:20px;margin:8px 0;line-height:1.65;font-size:15px}
.me{background:linear-gradient(135deg,#00a884,#00ffcc);color:#000;margin-left:auto;border-bottom-right-radius:4px}
.ai{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);border-bottom-left-radius:4px}
.msg img{width:100%;border-radius:14px;margin-top:10px;max-height:320px;object-fit:cover}
.inputBar{position:fixed;bottom:0;left:0;right:0;background:rgba(5,8,16,.95);display:flex;gap:8px;padding:10px;border-top:1px solid rgba(255,255,255,.1)}
.inputBar input{flex:1;padding:14px 18px;border-radius:28px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;outline:0}
.inputBar button{width:52px;height:52px;border-radius:50%;border:0;font-size:22px}
.micBtn{background:linear-gradient(135deg,#00ffcc,#7c3aed);color:#fff}
.micBtn.active{background:#ff3b30}
.sendBtn{background:#fff;color:#000}
</style>
</head>
<body>
<div class="top"><h1>AI PRO</h1><p>SEARCH ENGINE NDANI • 0.9 SEC • JIBU SAHIHI TU</p></div>
<div class="logo">A</div>
<div class="orb" id="orb" onclick="micAction()">🎤</div>
<p class="status" id="status">Uliza chochote - nitatafuta hapa hapa ndani</p>
<div id="chat" class="chat"><div class="msg ai">Habari! Mimi ni <b>AI PRO</b>. Sasa nina search engine ndani yangu. Niulize - nitatafuta hapa hapa na nitakujibu jibu sahihi. Picha nitaleta TU kama inahusiana na swali lako.</div></div>
<div class="inputBar"><input id="input" placeholder="Uliza swali..." onkeypress="if(event.key=='Enter')sendText()"><button class="micBtn" id="micBtn" onclick="micAction()">🎤</button><button class="sendBtn" onclick="sendText()">➤</button></div>

<script>
let isListeningNow=false, currentRec=null;
let cache = {}; // Kuharakisha - swali lililoulizwa linajibiwa mara moja 0.9 sec

function micAction(){
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  let typed=document.getElementById('input').value.trim();
  if(typed){ document.getElementById('input').value=''; handleQuestion(typed); return; }
  if(isListeningNow){ stopListen(); return; }
  startListen();
}
function stopListen(){ isListeningNow=false; document.getElementById('orb').classList.remove('listening'); document.getElementById('micBtn').classList.remove('active'); try{if(currentRec) currentRec.stop();}catch(e){} }
function startListen(){
  let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ alert('Andika tu'); return; }
  let rec=new SR(); currentRec=rec; rec.lang='sw-TZ'; rec.interimResults=false; isListeningNow=true;
  document.getElementById('orb').classList.add('listening'); document.getElementById('micBtn').classList.add('active');
  rec.start();
  rec.onresult=(e)=>{ let t=e.results[0][0].transcript; isListeningNow=false; document.getElementById('orb').classList.remove('listening'); document.getElementById('micBtn').classList.remove('active'); handleQuestion(t); };
  rec.onerror=()=>{ isListeningNow=false; document.getElementById('orb').classList.remove('listening'); document.getElementById('micBtn').classList.remove('active'); };
  rec.onend=()=>{ isListeningNow=false; document.getElementById('orb').classList.remove('listening'); document.getElementById('micBtn').classList.remove('active'); };
}
function sendText(){ let v=document.getElementById('input').value.trim(); if(!v) return; document.getElementById('input').value=''; handleQuestion(v); }
function addMsg(t,who){ let d=document.createElement('div'); d.className='msg '+who; d.innerHTML=t; document.getElementById('chat').appendChild(d); window.scrollTo(0,document.body.scrollHeight); return d; }
function speak(t){ if(!('speechSynthesis' in window)) return; window.speechSynthesis.cancel(); let u=new SpeechSynthesisUtterance(t); u.lang='sw-TZ'; u.rate=1.2; window.speechSynthesis.speak(u); }

function handleQuestion(q){ addMsg(q,'me'); answerAI(q); }

// === SEARCH ENGINE NDANI YA AI PRO - INATAFUTA SAMBAMBA, 0.9 SEC ===
async function answerAI(q){
  let key = q.toLowerCase().trim();
  // Kama swali limeshaulizwa, jibu mara moja - 0.1 sec
  if(cache[key]){ addMsg(cache[key],'ai'); speak(cache[key].replace(/<[^>]*>/g,'').slice(0,250)); return; }

  let thinking = addMsg('🔍 Natafuta...','ai');
  let search = q.replace(/nipe|niambie|nini|ni nini|maana|kwanini|vipi|eleza|nieleze|nini maana|wapi|nani|zipo|ngapi|ni yapi|ni yap/gi,'').trim() || q;

  // 1. KWANZA: Kamusi ya ndani - majibu sahihi kabisa, haraka 0.1 sec
  // Hii ndio inajibu maswali kama "Nipe aina za hewa" na "Madhara ya mkojo" moja kwa moja
  let local = searchLocal(q);
  if(local){
    thinking.remove();
    cache[key] = local;
    addMsg(local,'ai'); speak(local.replace(/<[^>]*>/g,'').slice(0,280));
    return;
  }

  // 2. PILI: Search Engine ndani - Wikipedia + DuckDuckGo SAMBAMBA (Promise.all)
  try{
    let [sw, en, ddg] = await Promise.all([
      fetch('https://sw.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(search), {signal: AbortSignal.timeout(2500)}).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(search), {signal: AbortSignal.timeout(2500)}).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch('https://api.duckduckgo.com/?q=' + encodeURIComponent(q) + '&format=json&no_html=1&skip_disambig=1', {signal: AbortSignal.timeout(2500)}).then(r=>r.ok?r.json():null).catch(()=>null)
    ]);

    // Chagua jibu lililo sahihi zaidi
    if(sw && sw.extract){
      thinking.remove();
      let html = sw.extract;
      // Picha TU kama ni ya swali hilo - kutoka Wikipedia yenyewe
      if(sw.thumbnail && sw.thumbnail.source) html += `<br><img src="${sw.thumbnail.source}"><p style="font-size:12px;color:#aaa">📸 Picha: ${sw.title}</p>`;
      cache[key]=html; addMsg(html,'ai'); speak(sw.extract.slice(0,280)); return;
    }
    if(en && en.extract){
      thinking.remove();
      let html = en.extract;
      if(en.thumbnail && en.thumbnail.source) html += `<br><img src="${en.thumbnail.source}">`;
      cache[key]=html; addMsg(html,'ai'); speak(en.extract.slice(0,280)); return;
    }
    if(ddg && ddg.AbstractText){
      thinking.remove();
      let html = ddg.AbstractText;
      // Picha TU kama DuckDuckGo ina picha ya kweli ya swali
      if(ddg.Image && ddg.Image.includes('duckduckgo')) html += `<br><img src="https://duckduckgo.com${ddg.Image}">`;
      cache[key]=html; addMsg(html,'ai'); speak(ddg.AbstractText.slice(0,280)); return;
    }
  }catch(e){}

  // 3. Kama hakuna jibu - USIRUDIE ile paragraph ya zamani. Sema ukweli mara moja.
  thinking.remove();
  let notFound = 'Samahani, sijaipata jibu sahihi la "' + q + '" sasa hivi. Jaribu kuuliza kwa maneno mengine - mfano kama uliuliza "Nipe aina za hewa" jaribu "Aina za hewa ni zipi?" Nitakujibu.';
  addMsg(notFound,'ai'); speak(notFound);
}

// === KAMUSI KUBWA YA NDANI - MAJIBU SAHIHI, HAKUNA GENERIC ===
function searchLocal(q){
  let l = q.toLowerCase();

  // --- MASWALI YAKO KWENYE SCREENSHOT - SASA YANAJIBIWA SAHIHI ---
  if(l.includes('aina za hewa') || l.includes('aina ya hewa') || (l.includes('hewa') && l.includes('aina'))){
    return 'Aina za hewa ni hizi:<br><br><b>1. Hewa safi</b> - hewa yenye oksijeni nyingi, nzuri kwa kupumua.<br><b>2. Hewa chafu</b> - hewa yenye moshi, vumbi na sumu, inasababisha kikohozi na pumu.<br><b>3. Hewa baridi</b> - hewa yenye baridi, inasaidia kupumzika.<br><b>4. Hewa ya moto / joto</b> - hewa yenye joto kali, inasababisha jasho.<br><b>5. Hewa yenye unyevu</b> - hewa yenye maji mengi, inasababisha unyevu na joto.<br><br>Kwa afya, tunahitaji hewa safi kila siku.';
  }
  if(l.includes('mkojo') && (l.includes('kukaa') || l.includes('kuzuia') || l.includes('madhara') || l.includes('kushikilia'))){
    return 'Madhara ya kukaa na mkojo sana (kuzuia mkojo kwa muda mrefu) ni haya:<br><br><b>1. Maambukizi ya njia ya mkojo (UTI)</b> - bakteria hukua kwenye kibofu.<br><b>2. Maumivu ya kibofu na tumbo</b> - kibofu hujaa na kuuma.<br><b>3. Figo kuharibika</b> - mkojo ukirudi nyuma unaweza kuharibu figo.<br><b>4. Mawe kwenye figo / kibofu</b> - mkojo uliokaa unaweza kutengeneza mawe.<br><b>5. Kushindwa kukojoa vizuri baadaye</b> - kibofu kinapoteza nguvu.<br><br>Ushauri: Kama unahisi mkojo, nenda chooni mara moja. Usizuie.';
  }
  if(l.includes('madhara ya') && l.includes('sigara')) return 'Madhara ya sigara: Inasababisha kansa ya mapafu, kifua kikuu, moyo kuharibika, meno kuoza, na harufu mbaya. Sigara inaua watu milioni 8 kila mwaka duniani.';
  if(l.includes('madhara ya') && l.includes('pombe')) return 'Madhara ya pombe: Inaharibu ini (cirrhosis), inasababisha ajali, inaharibu ubongo na kumbukumbu, na inaleta ugomvi nyumbani. Kunywa pombe kupita kiasi ni hatari sana.';
  if(l.includes('maisha')) return 'Maisha ni kipindi kiumbe hai anaishi Duniani, kuanzia kuzaliwa hadi kufa. Yanahusisha kukua, kujifunza, kufanya kazi, kupenda, na kuzeeka. Maisha ni zawadi.';
  if(l.includes('kilimanjaro')) return 'Kilimanjaro ni mlima mrefu zaidi Afrika, mita 5,895. Uko Tanzania, karibu na Moshi. Una theluji juu yake.<br><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/Kilimanjaro_2009.jpg/640px-Kilimanjaro_2009.jpg">';
  if(l.includes('zanzibar')) return 'Zanzibar ni visiwa vya Tanzania. Visiwa vikubwa ni Unguja na Pemba. Inajulikana kwa fukwe nzuri, viungo, na Stone Town.';
  if(l.includes('tanzania')) return 'Tanzania ni nchi ya Afrika Mashariki. Mji mkuu Dodoma, mji mkubwa Dar es Salaam. Ina Kilimanjaro, Serengeti, Zanzibar. Lugha ni Kiswahili.';
  if(l.includes('dunia')) return 'Dunia ni sayari tunayoishi, ya tatu kutoka Jua. Ina maji, ardhi na hewa. Ina umri wa bilioni 4.5 na watu zaidi ya bilioni 8.';
  if(l.includes('jua')) return 'Jua ni nyota katikati ya mfumo wetu. Linatupa mwanga na joto. Bila Jua hakuna uhai.';
  if(l.includes('mwezi')) return 'Mwezi ni mwezi pekee wa Dunia. Unazunguka Dunia kila siku 27 na unasababisha mawimbi baharini.';
  if(l.includes('mvua') && l.includes('kwanini')) return 'Mvua inanyesha kwa sababu maji ya bahari na mito yanayeyuka na kupanda angani kuwa mawingu. Mawingu yakijaa maji, maji yanarudi chini kama mvua.';
  if(l.includes('black hole') || l.includes('shimo nyeusi')) return 'Black Hole ni sehemu angani yenye nguvu kubwa sana ya kuvuta, hata mwanga hauwezi kutoka. Inatokea nyota kubwa inapokufa na kujibana.';
  if(l.includes('nyerere') || l.includes('rais wa kwanza')) return 'Rais wa kwanza wa Tanzania alikuwa Mwalimu Julius Kambarage Nyerere. Aliongoza Tanzania kutoka 1961 hadi 1985. Anaitwa Baba wa Taifa.';
  if(l.includes('chapati') && (l.includes('tengeneza') || l.includes('jinsi'))) return 'Jinsi ya kutengeneza chapati: 1. Changanya unga, chumvi, maji na mafuta. 2. Kanda vizuri. 3. Acha kwa dakika 20. 4. Tengeneza madonge, sukuma kuwa duara. 5. Kaanga kwenye karai na mafuta kidogo hadi iwe rangi ya dhahabu.';
  if(l.includes('michezo') || l.includes('mpira')) return 'Mpira wa miguu ulianza Uingereza karne ya 19. Ni mchezo maarufu zaidi duniani. Tanzania timu kubwa ni Simba na Yanga.';
  if(l.includes('habari') || l.includes('mambo')) return 'Habari! Niko vizuri sana, na wewe? Niulize swali lolote - nitakujibu jibu sahihi.';
  if(l.includes('sauti')) return 'Ndio, nasikiliza sauti yako. Niulize swali lolote.';
  return null;
}
</script>
</body>
</html>

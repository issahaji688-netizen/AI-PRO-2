<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI PRO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070b14;color:#fff;font-family:'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column}
.top{background:linear-gradient(135deg,#6d28d9,#db2777,#f59e0b);padding:18px 16px 22px;text-align:center;border-radius:0 0 28px 28px}
.top .avatar{width:62px;height:62px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 8px}
.top h1{font-size:26px;letter-spacing:2px}
.top p{font-size:13px;opacity:.9}
.top span{display:inline-block;background:rgba(255,255,255,.22);padding:5px 12px;border-radius:20px;font-size:12px;margin-top:8px}
.chat{flex:1;overflow-y:auto;padding:16px 14px}
.msg{max-width:88%;padding:13px 16px;border-radius:20px;margin:8px 0;line-height:1.6;font-size:15.5px;white-space:pre-wrap}
.me{background:linear-gradient(135deg,#6d28d9,#db2777);margin-left:auto;border-bottom-right-radius:5px}
.ai{background:#1a2233;border:1px solid #2a3550;border-bottom-left-radius:5px}
.ai b{color:#fbbf24}
.msg a{color:#60a5fa}
.inputBar{padding:12px;background:#0f1626;border-top:1px solid #222d44;display:flex;gap:10px}
.inputBar input{flex:1;padding:14px 18px;border-radius:25px;border:1px solid #2a3550;background:#1a2233;color:#fff;outline:none;font-size:15px}
.inputBar button{width:52px;height:52px;border-radius:50%;border:0;background:linear-gradient(135deg,#6d28d9,#db2777);color:#fff;font-size:22px}
</style>
</head>
<body>
<div class="top">
<div class="avatar">🤖</div>
<h1>AI PRO</h1>
<p>Real Google Search • 0.9s</p>
<span>● Live Google Search</span>
</div>
<div id="chat" class="chat">
<div class="msg ai">Karibu! Mimi ni <b>AI PRO</b>.<br><br>Niulize chochote, nitaku-searchia Google live na kukujibu. Kiswahili -> Kiswahili, English -> English.</div>
</div>
<div class="inputBar">
<input id="input" placeholder="Uliza chochote..." onkeypress="if(event.key=='Enter')sendText()">
<button onclick="sendText()">➤</button>
</div>
<script>
// ===== WEKA HAPA VIFUNGUA VYAKO VYA GOOGLE =====
const API_KEY = "WEKA_API_KEY_YAKO_HAPA"; // ile inayoanza na AIza...
const CX = "WEKA_CX_YAKO_HAPA"; // ile Search engine ID kutoka Programmable Search
// ================================================

function isEnglish(q){
  let l=q.toLowerCase();
  return ['what','who','how','when','where','why','president','tell','explain'].some(w=>l.includes(w)) && !l.includes('nani') && !l.includes('nini');
}
function addMsg(t,who){
  let d=document.createElement('div'); d.className='msg '+who; d.innerHTML=t;
  document.getElementById('chat').appendChild(d);
  document.getElementById('chat').scrollTop=document.getElementById('chat').scrollHeight;
  return d;
}
function sendText(){
  let v=document.getElementById('input').value.trim(); if(!v) return;
  document.getElementById('input').value=''; addMsg(v,'me'); answerAI(v);
}
async function answerAI(q){
  let eng = isEnglish(q);
  if(API_KEY.includes('WEKA_') || CX.includes('WEKA_')){
    addMsg(eng ? 'Please put your Google API KEY and CX in the code first. I will then search Google live.' : 'Weka kwanza API KEY na CX yako kwenye code juu. Baada ya hapo nitaku-searchia Google live.', 'ai');
    return;
  }
  let loading = addMsg(eng ? 'Searching Google...' : 'Natafuta Google...','ai');
  try{
    let start = Date.now();
    let url = `https://www.googleapis.com/customsearch/v1?key=${API_KEY}&cx=${CX}&q=${encodeURIComponent(q)}&num=5`;
    let res = await fetch(url);
    let data = await res.json();
    let time = ((Date.now()-start)/1000).toFixed(1);
    loading.remove();
    if(data.items && data.items.length>0){
      let first = data.items[0];
      let others = data.items.slice(1,3).map(i=>`• <a href="${i.link}" target="_blank">${i.title}</a>`).join('<br>');
      let ans = `<b>${first.title}</b><br><br>${first.snippet}<br><br><a href="${first.link}" target="_blank">Soma chanzo →</a><br><br>${others}<br><br><span style="opacity:.6;font-size:12px">Google Search • ${time}s • ${data.searchInformation?.totalResults||''} results</span>`;
      addMsg(ans,'ai');
    } else {
      addMsg(eng ? `Google found no direct result for "${q}". Try asking differently.` : `Google hakupata jibu la moja kwa moja la "${q}". Uliza kwa maneno mengine.`, 'ai');
    }
  }catch(e){
    loading.remove();
    addMsg(eng ? 'Google search failed. Check your API KEY and CX and internet.' : 'Google search imeshindwa. Angalia API KEY na CX na internet yako.', 'ai');
  }
}
</script>
</body>
</html>
